# coturn, configured for Veiled's calls.
#
# Authentication is coturn's REST scheme: the API hands the app a
# username of "<expiry>:<userId>" and the HMAC of it under
# static-auth-secret as the password. coturn recomputes the same HMAC,
# so no credentials are stored here or shipped in the app.

listening-port=3478
tls-listening-port=5349

fingerprint
use-auth-secret
# Supplied from the environment by docker-compose.
# static-auth-secret=<TURN_SECRET>
# realm=<TURN_REALM>

# The relay's own ports. These must be open, or coturn will allocate
# ports that nothing outside can reach.
min-port=49160
max-port=49200

# A relay is a tempting open proxy, so it is only ever allowed to reach
# the public internet, never anything on the inside of this network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Nobody needs to log in with a name and password, so don't accept one.
no-cli
no-tlsv1
no-tlsv1_1

# Keep one client from relaying the whole server's bandwidth.
user-quota=12
total-quota=1200
